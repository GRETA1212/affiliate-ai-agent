[project]
name = "affiliate-intelligence-engine"
version = "0.3.0"
description = "Affiliate opportunity discovery, scoring, persistence, campaign tracking, and revenue intelligence."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.28",
]

[project.scripts]
affiliate-intel = "affiliate_intel.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app:app"
