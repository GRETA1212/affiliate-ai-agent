name: Bootstrap AI Media Factory

on:
  push:
    branches:
      - agent/ai-media-factory

permissions:
  contents: write

jobs:
  expand-and-verify:
    if: contains(github.event.head_commit.message, 'bootstrap media factory source')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-media-factory
          fetch-depth: 0

      - name: Reconstruct verified source
        run: bash imports/media-factory-source/reconstruct.sh

      - name: Apply caption-safe rendering fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('media-factory')

          for rel, value in [
              ('brands/maya/brand.json', 18),
              ('brands/kids-learning/brand.json', 16),
          ]:
              p = root / rel
              s = p.read_text()
              s = re.sub(r'"maxCaptionCharsPerLine":\s*\d+', f'"maxCaptionCharsPerLine": {value}', s)
              p.write_text(s)

          p = root / 'packages/renderer/fallback/render_frames.py'
          s = p.read_text()
          s = s.replace(
              'HOOK_CHIP_MAX_CHARS = 38  # keep in sync with core/text.ts\n',
              'HOOK_CHIP_MAX_CHARS = 38  # keep in sync with core/text.ts\nCAPTION_SAFE_WIDTH = 920\nCAPTION_MIN_FONT_SIZE = 42\n',
          )
          marker = '''def draw_centered(draw, text, font, y, fill, shadow=True):\n    w, h = text_size(draw, text, font)\n    x = (WIDTH - w) // 2\n    if shadow:\n        draw.text((x + 3, y + 4), text, font=font, fill=(0, 0, 0))\n    draw.text((x, y), text, font=font, fill=fill)\n    return h\n\n\n'''
          replacement = '''def draw_centered(draw, text, font, y, fill, shadow=True):\n    w, h = text_size(draw, text, font)\n    x = (WIDTH - w) // 2\n    if shadow:\n        draw.text((x + 3, y + 4), text, font=font, fill=(0, 0, 0))\n    draw.text((x, y), text, font=font, fill=fill)\n    return h\n\n\ndef fit_caption_font(draw, lines, font_name: str, initial_size: int):\n    \"\"\"Shrink until every rendered glyph run fits the 920px safe width.\"\"\"\n    size = initial_size\n    while size > CAPTION_MIN_FONT_SIZE:\n        font = load_font(font_name, size)\n        if all(text_size(draw, line, font)[0] <= CAPTION_SAFE_WIDTH for line in lines):\n            return font\n        size -= 2\n    return load_font(font_name, CAPTION_MIN_FONT_SIZE)\n\n\n'''
          if marker not in s:
              raise SystemExit('fallback renderer insertion point missing')
          s = s.replace(marker, replacement)
          s = s.replace(
              'caption_font = load_font(theme["displayFont"], 92 if scene["isCta"] else 78)\n    lines = scene["captionLines"]',
              'lines = scene["captionLines"]\n    caption_font = fit_caption_font(draw, lines, theme["displayFont"], 92 if scene["isCta"] else 78)',
          )
          p.write_text(s)

          p = root / 'packages/renderer/remotion/VerticalVideo.tsx'
          s = p.read_text()
          s = s.replace(
              'const SAFE_BOTTOM = 420;\n',
              "const SAFE_BOTTOM = 420;\nconst CAPTION_SAFE_WIDTH = 920;\nconst CAPTION_MIN_FONT_SIZE = 42;\n\nfunction fitCaptionFontSize(lines: string[], fontFamily: string, initialSize: number): number {\n  if (typeof document === 'undefined') return initialSize;\n  const canvas = document.createElement('canvas');\n  const ctx = canvas.getContext('2d');\n  if (!ctx) return initialSize;\n  for (let size = initialSize; size >= CAPTION_MIN_FONT_SIZE; size -= 2) {\n    ctx.font = `700 ${size}px ${fontFamily}`;\n    if (lines.every((line) => ctx.measureText(line).width <= CAPTION_SAFE_WIDTH)) return size;\n  }\n  return CAPTION_MIN_FONT_SIZE;\n}\n",
          )
          s = s.replace(
              '  const { theme } = input;\n\n  // Transitions are entry effects',
              '  const { theme } = input;\n  const captionFontSize = fitCaptionFontSize(scene.captionLines, theme.displayFont, scene.isCta ? 92 : 78);\n\n  // Transitions are entry effects',
          )
          s = s.replace('fontSize: scene.isCta ? 92 : 78,', 'fontSize: captionFontSize,')
          p.write_text(s)

          p = root / 'tests/claims-qa.test.ts'
          s = p.read_text()
          old = '''  it('allows a caption that wraps to exactly the line limit', () => {\n    // 89 chars at 30 chars/line wraps to exactly 3 lines, which is the limit.\n    const report = runQaAgent(\n      makePackage({ onScreenText: 'THIS ON SCREEN TEXT IS FAR TOO LONG TO FIT INSIDE THE SAFE AREA OF A VERTICAL VIDEO FRAME' }),\n    );\n    expect(rules(report)).not.toContain('caption_overflow');\n  });\n\n  it('blocks caption overflow past the line limit', () => {\n    const report = runQaAgent(\n      makePackage({\n        onScreenText:\n          'THIS ON SCREEN TEXT IS FAR TOO LONG TO FIT INSIDE THE SAFE AREA OF A VERTICAL VIDEO FRAME AND IT JUST KEEPS GOING WELL PAST ANY REASONABLE CAPTION LENGTH',\n      }),\n    );\n    expect(rules(report)).toContain('caption_overflow');\n  });\n'''
          new = '''  it('allows a caption that wraps to exactly the configured line limit', () => {\n    const line = 'X'.repeat(maya.rules.maxCaptionCharsPerLine);\n    const text = Array.from({ length: maya.rules.maxCaptionLinesPerScene }, () => line).join(' ');\n    const report = runQaAgent(makePackage({ onScreenText: text }));\n    expect(rules(report)).not.toContain('caption_overflow');\n  });\n\n  it('blocks caption overflow past the configured line limit', () => {\n    const line = 'X'.repeat(maya.rules.maxCaptionCharsPerLine);\n    const text = Array.from({ length: maya.rules.maxCaptionLinesPerScene + 1 }, () => line).join(' ');\n    const report = runQaAgent(makePackage({ onScreenText: text }));\n    expect(rules(report)).toContain('caption_overflow');\n  });\n'''
          if old not in s:
              raise SystemExit('caption QA test block missing')
          p.write_text(s.replace(old, new))
          PY

      - name: Install and test
        working-directory: media-factory
        run: |
          npm install
          npm test
          npm run typecheck

      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-factory/
          git rm -r imports/media-factory-source/
          git rm .github/workflows/bootstrap-media-factory.yml
          git commit -m "feat: build AI media factory vertical slice"
          git push origin HEAD:agent/ai-media-factory
