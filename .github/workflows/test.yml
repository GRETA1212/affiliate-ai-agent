name: test

on:
  push:
    branches: [main, agent/mvp]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - run: test -f dist/index.html
      - run: test -f dist/sitemap.xml
      - run: test -f dist/affiliate-disclosure/index.html
      - run: test -f dist/comparisons/lovable-vs-hostinger-horizons/index.html
      - run: test -f dist/ai-app-builders/lovable-buyer-guide/index.html
      - run: test -f dist/ai-voice/elevenlabs-buyer-guide/index.html
      - run: test -f dist/ai-marketing/semrush-ai-visibility-buyer-guide/index.html
      - run: test -f dist/best-ai-tools/small-business-2026/index.html
      - run: grep -q "11 August 2026" dist/comparisons/lovable-vs-hostinger-horizons/index.html
