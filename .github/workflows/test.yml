name: test

on:
  push:
    branches: [main, agent/mvp, agent/maya-exe]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - run: test -f dist/index.html
      - run: test -f dist/sitemap.xml
      - run: test -f dist/affiliate-disclosure/index.html
      - run: test -f dist/comparisons/lovable-vs-hostinger-horizons/index.html
      - run: test -f dist/ai-app-builders/hostinger-horizons-buyer-guide/index.html
      - run: test -f dist/ai-app-builders/lovable-buyer-guide/index.html
      - run: test -f dist/ai-voice/elevenlabs-buyer-guide/index.html
      - run: test -f dist/ai-marketing/semrush-ai-visibility-buyer-guide/index.html
      - run: test -f dist/best-ai-tools/small-business-2026/index.html
      - run: grep -q "18 August 2026" dist/ai-app-builders/hostinger-horizons-buyer-guide/index.html
      - name: Build with Hostinger affiliate tracking enabled
        run: npm run build
        env:
          HOSTINGER_HORIZONS_AFFILIATE_ENABLED: "1"
          AFFILIATE_TRACKING_BASE_URL: "https://go.example.test"
      - run: grep -q "https://go.example.test/go/hostinger-horizons?source=website&amp;medium=affiliate&amp;content=hostinger-horizons-buyer-guide" dist/ai-app-builders/hostinger-horizons-buyer-guide/index.html
      - run: grep -q 'rel="sponsored nofollow noopener noreferrer"' dist/ai-app-builders/hostinger-horizons-buyer-guide/index.html

  maya-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maya-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
        env:
          MAYA_SITE_URL: "https://maya.example.test"
      - run: test -f dist/index.html
      - run: test -f dist/videos/index.html
      - run: test -f dist/reviews/index.html
      - run: test -f dist/ai-beauty-tools/index.html
      - run: test -f dist/beauty-tech/index.html
      - run: test -f dist/guides/index.html
      - run: test -f dist/templates/index.html
      - run: test -f dist/deals/index.html
      - run: test -f dist/tiktok-shop/index.html
      - run: test -f dist/about/index.html
      - run: test -f dist/contact/index.html
      - run: test -f dist/affiliate-disclosure/index.html
      - run: test -f dist/shop-the-look/ai-picked-makeup/index.html
      - run: grep -q "Maya is a virtual AI creator" dist/affiliate-disclosure/index.html
      - run: grep -q "Look direction, not a fake product test" dist/shop-the-look/ai-picked-makeup/index.html
      - run: grep -q "/shop-the-look/ai-picked-makeup/" dist/sitemap.xml
      - name: Build with a real-style TikTok Shop affiliate URL
        run: npm run build
        env:
          MAYA_SITE_URL: "https://maya.example.test"
          TIKTOK_SHOP_LED_MASK_URL: "https://shop.example.test/product/led-mask?affiliate=maya"
      - run: grep -q "https://shop.example.test/product/led-mask?affiliate=maya" dist/tiktok-shop/index.html
      - run: grep -q 'rel="sponsored nofollow noopener noreferrer"' dist/tiktok-shop/index.html
